# Weekly version-update PRs, grouped per ecosystem. Nothing merges on its own:
# every PR is reviewed and must pass ci.yml like any other.
#
# Directories are listed one by one so testbed/ is never included: its pins are
# deliberately vulnerable (rule 5). Not covered, by design, and bumped by hand:
# Grype and Syft (ARG-driven FROM lines, bumped together), the Syft sums in
# agent/install.sh, govulncheck in scripts/test.sh, the tag-only helper images
# in scripts/, our own ghcr.io/amanahlab images (the post-release pin PR) and
# the agent snippets in web/src/lib/agent.ts.
#
# Commit prefixes decide releases (release-please.yml): what ships in our images
# (base images, Go modules, web runtime npm) uses fix(deps) and so produces a
# release; actions, Compose and npm dev dependencies use ci/chore and wait for
# the next release.
#
# A golang bump in the Dockerfile also needs the same ref in scripts/go.sh;
# ci.yml fails until both match. Node stays on its LTS line (scripts/npm.sh
# uses the same major): majors of node and @types/node are bumped by hand.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: docker
    directories: [/, /agent]
    schedule:
      interval: weekly
    commit-message:
      prefix: fix
      include: scope
    groups:
      base-images:
        patterns: ["*"]
    ignore:
      - dependency-name: node
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
    ignore:
      # Pinned by the post-release PR, together with the README and docs.
      - dependency-name: "ghcr.io/amanahlab/*"
      # Built locally by docker-compose.dev.yml, not pulled.
      - dependency-name: "labwarden*"

  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: fix
      include: scope
    groups:
      go-modules:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    commit-message:
      prefix: fix
      prefix-development: chore
      include: scope
    groups:
      web:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
