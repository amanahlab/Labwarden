name: release

# Publishes the multi-arch (amd64 + arm64) server and agent images to GHCR when
# a vX.Y.Z tag is pushed. workflow_dispatch reruns a release without retagging:
# pick the tag under "Use workflow from". Dispatching from a branch fails on
# purpose, and re-dispatching an older tag moves `latest` back to it.
#
# The agent is published first, and the dashboard build embeds that agent's
# tag@index digest in its agent snippets, so each release shows its own agent.
#
# After each release, a follow-up PR pins the new tag and its multi-arch INDEX
# digest wherever the old one appears (git grep -n 'ghcr.io/amanahlab/labwarden'),
# found with docker buildx imagetools inspect, or read from the GitHub Release the
# github-release job creates. Never pin a platform digest: the index also lists
# unknown/unknown attestation entries, and a platform digest would lock every
# host to one architecture.
#
# Both indexes get a signed SLSA build provenance attestation (actions/attest),
# which users check with: gh attestation verify oci://<image>@<digest> --repo amanahlab/Labwarden

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency: release-${{ github.ref }}

permissions: {}

jobs:
  release:
    runs-on: ubuntu-24.04
    # No contents: write here: this job runs npm ci and the tests.
    permissions:
      contents: read
      packages: write
      id-token: write # Sigstore signing certificate for the attestations
      attestations: write
      artifact-metadata: write # storage record for each attested image
    outputs:
      agent: ${{ steps.agent-image.outputs.image }}
      server: ${{ steps.server-image.outputs.image }}
    steps:
      # metadata-action emits semver tags only for a semver tag ref; anything
      # else would reach the push with no image tag.
      - name: Require a vX.Y.Z tag
        run: |
          case "$GITHUB_REF_TYPE:$GITHUB_REF_NAME" in
            tag:v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::run this workflow from a vX.Y.Z tag, not from $GITHUB_REF_NAME"; exit 1 ;;
          esac
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # A tag never publishes a build that fails the tests.
      - run: scripts/test.sh
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Image names are lowercase on purpose: the repository is amanahlab/Labwarden.
      # Tags: X.Y.Z, X.Y and latest (flavor latest=auto adds it for a release
      # tag, not for a pre-release such as v1.2.0-rc.1). The OCI labels include
      # org.opencontainers.image.source, which links the package to the repo.
      - id: meta-server
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/amanahlab/labwarden
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - id: meta-agent
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/amanahlab/labwarden-agent
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      # provenance mode=max records every build arg in the published attestation:
      # never pass a secret as a build-arg.
      - id: agent
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: agent/
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta-agent.outputs.tags }}
          labels: ${{ steps.meta-agent.outputs.labels }}
          provenance: mode=max
          sbom: true
          push: true
      # Fail unless the pushed digest is the multi-arch index behind the new tag:
      # a platform digest would lock Docker hosts to one architecture.
      - id: agent-image
        env:
          REF: ghcr.io/amanahlab/labwarden-agent:${{ steps.meta-agent.outputs.version }}
          DIGEST: ${{ steps.agent.outputs.digest }}
        run: |
          index=$(docker buildx imagetools inspect "$REF" --format '{{json .Manifest}}' |
            jq -r 'select(.mediaType == "application/vnd.oci.image.index.v1+json") | .digest')
          if [ -z "$DIGEST" ] || [ "$index" != "$DIGEST" ]; then
            echo "::error::$REF: pushed digest '$DIGEST' is not the index digest '$index'"
            exit 1
          fi
          echo "image=$REF@$DIGEST" >> "$GITHUB_OUTPUT"
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/amanahlab/labwarden-agent
          subject-digest: ${{ steps.agent.outputs.digest }}
          push-to-registry: true
      - id: server
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ github.ref_name }}
            AGENT_IMAGE=${{ steps.agent-image.outputs.image }}
          tags: ${{ steps.meta-server.outputs.tags }}
          labels: ${{ steps.meta-server.outputs.labels }}
          provenance: mode=max
          sbom: true
          push: true
      # Same check as for the agent; the index digest is what users pin.
      - id: server-image
        env:
          REF: ghcr.io/amanahlab/labwarden:${{ steps.meta-server.outputs.version }}
          DIGEST: ${{ steps.server.outputs.digest }}
        run: |
          index=$(docker buildx imagetools inspect "$REF" --format '{{json .Manifest}}' |
            jq -r 'select(.mediaType == "application/vnd.oci.image.index.v1+json") | .digest')
          if [ -z "$DIGEST" ] || [ "$index" != "$DIGEST" ]; then
            echo "::error::$REF: pushed digest '$DIGEST' is not the index digest '$index'"
            exit 1
          fi
          echo "image=$REF@$DIGEST" >> "$GITHUB_OUTPUT"
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/amanahlab/labwarden
          subject-digest: ${{ steps.server.outputs.digest }}
          push-to-registry: true

  # The GitHub Release for the tag: both images by tag and index digest, how to
  # verify them, then GitHub's generated notes. A rerun (workflow_dispatch)
  # pushes new digests, so it rewrites the notes of the existing release.
  github-release:
    needs: release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
      SERVER: ${{ needs.release.outputs.server }}
      AGENT: ${{ needs.release.outputs.agent }}
    steps:
      - run: |
          # The newest stable tag below this one; empty for the first release.
          prev=$(gh api "repos/$GH_REPO/tags" --paginate --jq '.[].name' |
            grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V |
            awk -v t="$TAG" '$0 == t { exit } { p = $0 } END { print p }')
          {
            echo "## Images"
            echo
            echo "Pin them by tag and multi-arch index digest:"
            echo
            echo '```'
            echo "$SERVER"
            echo "$AGENT"
            echo '```'
            echo
            echo "## Verify"
            echo
            echo "Both images carry a signed build provenance attestation from this repository's release workflow:"
            echo
            echo '```sh'
            echo "gh attestation verify oci://${SERVER%%:*}@${SERVER#*@} --repo $GH_REPO"
            echo "gh attestation verify oci://${AGENT%%:*}@${AGENT#*@} --repo $GH_REPO"
            echo '```'
            echo
            gh api "repos/$GH_REPO/releases/generate-notes" -f tag_name="$TAG" \
              ${prev:+-f previous_tag_name="$prev"} --jq .body
          } > notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file notes.md
          else
            case "$TAG" in *-*) pre=--prerelease ;; *) pre= ;; esac
            # shellcheck disable=SC2086 # $pre is one flag or nothing
            gh release create "$TAG" --verify-tag --title "$TAG" --notes-file notes.md $pre
          fi
