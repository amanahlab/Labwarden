name: release

# Publishes the multi-arch (amd64 + arm64) server and agent images to GHCR for
# a vX.Y.Z tag. Normally release-please.yml dispatches it on the tag it created
# when a release PR merged (a tag made with GITHUB_TOKEN starts no push run).
# A tag pushed by hand still runs it, as a fallback. workflow_dispatch also
# reruns a release without retagging: pick the tag under "Use workflow from".
# Dispatching from a branch fails on purpose, and re-dispatching an older tag
# moves `latest` back to it.
#
# The agent is published first, and the dashboard build embeds that agent's
# tag@index digest in its agent snippets, so each release shows its own agent.
#
# Then github-release adds both tag@index digests to the release notes and
# publishes the release, and pin-pr opens the follow-up PR that pins them
# wherever the old ones appear. Never pin a platform digest: the index also
# lists unknown/unknown attestation entries, and a platform digest would lock
# every host to one architecture.
#
# Both indexes get a signed SLSA build provenance attestation (actions/attest),
# which users check with: gh attestation verify oci://<image>@<digest> --repo amanahlab/Labwarden

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency: release-${{ github.ref }}

permissions: {}

jobs:
  release:
    runs-on: ubuntu-24.04
    # No contents: write here: this job runs npm ci and the tests.
    permissions:
      contents: read
      packages: write
      id-token: write # Sigstore signing certificate for the attestations
      attestations: write
      artifact-metadata: write # storage record for each attested image
    outputs:
      agent: ${{ steps.agent-image.outputs.image }}
      server: ${{ steps.server-image.outputs.image }}
    steps:
      # metadata-action emits semver tags only for a semver tag ref; anything
      # else would reach the push with no image tag.
      - name: Require a vX.Y.Z tag
        run: |
          case "$GITHUB_REF_TYPE:$GITHUB_REF_NAME" in
            tag:v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::run this workflow from a vX.Y.Z tag, not from $GITHUB_REF_NAME"; exit 1 ;;
          esac
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # A tag never publishes a build that fails the tests.
      - run: scripts/test.sh
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Image names are lowercase on purpose: the repository is amanahlab/Labwarden.
      # Tags: X.Y.Z, X.Y and latest (flavor latest=auto adds it for a release
      # tag, not for a pre-release such as v1.2.0-rc.1). The OCI labels include
      # org.opencontainers.image.source, which links the package to the repo.
      - id: meta-server
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/amanahlab/labwarden
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - id: meta-agent
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/amanahlab/labwarden-agent
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      # provenance mode=max records every build arg in the published attestation:
      # never pass a secret as a build-arg.
      - id: agent
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: agent/
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta-agent.outputs.tags }}
          labels: ${{ steps.meta-agent.outputs.labels }}
          provenance: mode=max
          sbom: true
          push: true
      # Fail unless the pushed digest is the multi-arch index behind the new tag:
      # a platform digest would lock Docker hosts to one architecture.
      - id: agent-image
        env:
          REF: ghcr.io/amanahlab/labwarden-agent:${{ steps.meta-agent.outputs.version }}
          DIGEST: ${{ steps.agent.outputs.digest }}
        run: |
          index=$(docker buildx imagetools inspect "$REF" --format '{{json .Manifest}}' |
            jq -r 'select(.mediaType == "application/vnd.oci.image.index.v1+json") | .digest')
          if [ -z "$DIGEST" ] || [ "$index" != "$DIGEST" ]; then
            echo "::error::$REF: pushed digest '$DIGEST' is not the index digest '$index'"
            exit 1
          fi
          echo "image=$REF@$DIGEST" >> "$GITHUB_OUTPUT"
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/amanahlab/labwarden-agent
          subject-digest: ${{ steps.agent.outputs.digest }}
          push-to-registry: true
      - id: server
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ github.ref_name }}
            AGENT_IMAGE=${{ steps.agent-image.outputs.image }}
          tags: ${{ steps.meta-server.outputs.tags }}
          labels: ${{ steps.meta-server.outputs.labels }}
          provenance: mode=max
          sbom: true
          push: true
      # Same check as for the agent; the index digest is what users pin.
      - id: server-image
        env:
          REF: ghcr.io/amanahlab/labwarden:${{ steps.meta-server.outputs.version }}
          DIGEST: ${{ steps.server.outputs.digest }}
        run: |
          index=$(docker buildx imagetools inspect "$REF" --format '{{json .Manifest}}' |
            jq -r 'select(.mediaType == "application/vnd.oci.image.index.v1+json") | .digest')
          if [ -z "$DIGEST" ] || [ "$index" != "$DIGEST" ]; then
            echo "::error::$REF: pushed digest '$DIGEST' is not the index digest '$index'"
            exit 1
          fi
          echo "image=$REF@$DIGEST" >> "$GITHUB_OUTPUT"
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/amanahlab/labwarden
          subject-digest: ${{ steps.server.outputs.digest }}
          push-to-registry: true

  # The GitHub Release for the tag: both images by tag and index digest and how
  # to verify them, between two markers, above the release notes. A release
  # from release-please already exists as a draft whose body is the changelog;
  # this job adds the images and publishes it. A tag pushed by hand has no
  # release yet, so it gets one with GitHub's generated notes. A rerun
  # (workflow_dispatch) pushes new digests and replaces the marked block only.
  github-release:
    needs: release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
      SERVER: ${{ needs.release.outputs.server }}
      AGENT: ${{ needs.release.outputs.agent }}
    steps:
      - run: |
          {
            echo "<!-- labwarden:images -->"
            echo "## Images"
            echo
            echo "Pin them by tag and multi-arch index digest:"
            echo
            echo '```'
            echo "$SERVER"
            echo "$AGENT"
            echo '```'
            echo
            echo "## Verify"
            echo
            echo "Both images carry a signed build provenance attestation from this repository's release workflow:"
            echo
            echo '```sh'
            echo "gh attestation verify oci://${SERVER%%:*}@${SERVER#*@} --repo $GH_REPO"
            echo "gh attestation verify oci://${AGENT%%:*}@${AGENT#*@} --repo $GH_REPO"
            echo '```'
            echo "<!-- /labwarden:images -->"
            echo
          } > images.md

          # The releases list includes drafts; the by-tag endpoint does not.
          id=$(gh api "repos/$GH_REPO/releases" --paginate \
            --jq '.[] | select(.tag_name == env.TAG) | .id' | head -n 1)
          if [ -n "$id" ]; then
            gh api "repos/$GH_REPO/releases/$id" --jq '.body // ""' |
              sed '/^<!-- labwarden:images -->$/,/^<!-- \/labwarden:images -->$/d' > body.md
          else
            : > body.md
          fi
          if ! grep -q '[^[:space:]]' body.md; then
            # The newest stable tag below this one; empty for the first release.
            # TAG joins the list so a prerelease (not stable) still finds its place.
            prev=$({ gh api "repos/$GH_REPO/tags" --paginate --jq '.[].name' |
              grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$'; echo "$TAG"; } | sort -uV |
              awk -v t="$TAG" '$0 == t { exit } { p = $0 } END { print p }')
            gh api "repos/$GH_REPO/releases/generate-notes" -f tag_name="$TAG" \
              ${prev:+-f previous_tag_name="$prev"} --jq .body > body.md
          fi
          cat images.md body.md > notes.md

          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GH_REPO/releases/$id" -F body=@notes.md -F draft=false --silent
          else
            case "$TAG" in *-*) pre=--prerelease ;; *) pre= ;; esac
            # shellcheck disable=SC2086 # $pre is one flag or nothing
            gh release create "$TAG" --verify-tag --title "$TAG" --notes-file notes.md $pre
          fi

  # The follow-up pin PR: the new tag@index digests replace the old ones in
  # docker-compose.yml (dashboard) and README.md, docs/setup/agent-docker.md and
  # the fallback in web/src/lib/agent.ts (agent). Only for the newest stable tag,
  # so re-dispatching an older release or a pre-release never moves the pins.
  # A rerun adds a commit to the existing branch. A push made with GITHUB_TOKEN
  # starts no pull_request run, so the job dispatches ci.yml on the branch.
  # No tests or npm here: this job holds contents: write.
  pin-pr:
    needs: [release, github-release]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
      actions: write # dispatch ci.yml
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
      SERVER: ${{ needs.release.outputs.server }}
      AGENT: ${{ needs.release.outputs.agent }}
    steps:
      - id: newest
        run: |
          newest=$(gh api "repos/$GH_REPO/tags" --paginate --jq '.[].name' |
            grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)
          if [ "$newest" = "$TAG" ]; then
            echo "pin=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::$TAG is not the newest stable tag ($newest); pins stay as they are"
          fi
      - if: steps.newest.outputs.pin == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - if: steps.newest.outputs.pin == 'true'
        run: |
          branch="chore/pin-$TAG"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
            git fetch --depth 1 origin "$branch"
            git switch -c "$branch" FETCH_HEAD
          else
            git switch -c "$branch"
          fi

          ref='[^@"[:space:]]+@sha256:[0-9a-f]{64}'
          sed -i -E "s#ghcr\.io/amanahlab/labwarden:$ref#$SERVER#g" docker-compose.yml
          sed -i -E "s#ghcr\.io/amanahlab/labwarden-agent:$ref#$AGENT#g" \
            README.md docs/setup/agent-docker.md web/src/lib/agent.ts
          # Every file must now hold the new pin: a file that lost its old
          # pin (moved, reworded) is a pin this job would silently skip.
          for pair in "docker-compose.yml|$SERVER" "README.md|$AGENT" \
              "docs/setup/agent-docker.md|$AGENT" "web/src/lib/agent.ts|$AGENT"; do
            if ! grep -qF "${pair#*|}" "${pair%%|*}"; then
              echo "::error::${pair%%|*} has no ${pair#*|} after the update; pin it by hand"
              exit 1
            fi
          done
          if git diff --quiet; then
            echo "::notice::$branch already pins these digests"
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -qam "chore: pin $TAG images by tag and index digest"
          git push origin "$branch"

          if [ -z "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            {
              echo "Follow-up to the $TAG release. Pins the new tag and multi-arch index digest:"
              echo
              echo "- \`$SERVER\` in \`docker-compose.yml\`"
              echo "- \`$AGENT\` in \`README.md\`, \`docs/setup/agent-docker.md\` and the fallback in \`web/src/lib/agent.ts\`"
              echo
              echo "Opened by the release workflow ($GITHUB_SERVER_URL/$GH_REPO/actions/runs/$GITHUB_RUN_ID)."
            } > pr.md
            gh pr create --base main --head "$branch" \
              --title "chore: pin $TAG images by tag and index digest" --body-file pr.md
          fi
          gh workflow run ci.yml --ref "$branch"
