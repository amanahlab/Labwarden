name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Same entrypoint as local development: everything runs in containers.
      - run: scripts/test.sh
      - run: docker build --build-arg VERSION=${GITHUB_SHA::7} -t vulnx:ci .
      - run: docker build -t vulnx-agent:ci agent/
