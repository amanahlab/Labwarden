name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Same entrypoint as local development (everything runs in containers), one
  # scripts/test.sh section per job so they run in parallel.
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        section: [go, web, vuln, shell]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Compiled dependencies (modernc sqlite above all) stay valid while our
      # code changes; go.sh pins the Go image, so a Go bump rolls the key.
      - if: matrix.section == 'go' || matrix.section == 'vuln'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/gomod
            ${{ runner.temp }}/gocache
          key: go-${{ matrix.section }}-${{ runner.os }}-${{ hashFiles('go.sum', 'scripts/go.sh') }}
          restore-keys: go-${{ matrix.section }}-${{ runner.os }}-
      - run: scripts/test.sh ${{ matrix.section }}
        env:
          # scripts/go.sh bind-mounts these instead of its named volumes.
          LABWARDEN_GOMODCACHE: ${{ runner.temp }}/gomod
          LABWARDEN_GOCACHE: ${{ runner.temp }}/gocache

  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The end-user file must work without a clone or .env: no ${X:?}, no build:.
      - run: |
          docker compose -f docker-compose.yml config -q
          if grep -n 'build:' docker-compose.yml; then echo "docker-compose.yml must not build" >&2; exit 1; fi
      - id: version
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Build only (no push, no load). Layers are cached in the GitHub Actions
      # cache; release.yml does not read it and always builds from scratch.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          build-args: VERSION=${{ steps.version.outputs.short }}
          cache-from: type=gha,scope=server
          cache-to: type=gha,scope=server,mode=max
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: agent/
          cache-from: type=gha,scope=agent
          cache-to: type=gha,scope=agent,mode=max
