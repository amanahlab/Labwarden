# Development override: builds the dashboard from source and adds the testbed.
# Used together with docker-compose.yml through COMPOSE_FILE, which
# scripts/dev-env.sh writes to .env:
#   COMPOSE_FILE=docker-compose.yml:docker-compose.dev.yml
# Then: docker compose up -d --build, and the testbed with --profile testbed.
# The testbed hosts are deliberately vulnerable: never deploy them.
services:
  labwarden:
    build:
      context: .
      args:
        VERSION: ${LABWARDEN_VERSION:-dev}
    image: labwarden:latest

  # --- testbed: proving ground, never deploy these -------------------------
  testbed-vm:
    profiles: [testbed]
    build: testbed/vm
    hostname: testbed-vm
    depends_on: [labwarden]
    environment:
      LABWARDEN_URL: http://labwarden:8080
      LABWARDEN_TOKEN: ${LABWARDEN_INGEST_TOKEN:?run scripts/dev-env.sh first}
      LABWARDEN_HOST: testbed-vm
      LABWARDEN_GROUP: testbed
      LABWARDEN_SCAN_PATHS: /
      LABWARDEN_SCAN_DOCKER: "false"
      LABWARDEN_CRON: "*/15 * * * *"
      LABWARDEN_INTERVAL: "900"
    volumes:
      - testbed-vm-state:/var/lib/labwarden

  testbed-workload:
    profiles: [testbed]
    build: testbed/docker
    image: labwarden-testbed-workload:latest
    labels:
      labwarden.scan: "true"

  # Read-only Docker API for the agent: GET/HEAD on containers and images
  # only, so the agent never holds the root-equivalent socket itself.
  testbed-docker-proxy:
    profiles: [testbed]
    image: tecnativa/docker-socket-proxy:v0.5.0@sha256:1f5038b54f06c3e18422902cf00ba21803d1c97805aae032e5e6673d532d3459
    environment:
      CONTAINERS: "1"
      IMAGES: "1"
      POST: "0"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  testbed-docker-agent:
    profiles: [testbed]
    build: agent
    image: labwarden-agent:latest
    hostname: testbed-docker
    depends_on: [labwarden, testbed-workload, testbed-docker-proxy]
    # Root only to own its state volume. CAP_DAC_OVERRIDE lets it unpack (and
    # remove) a container filesystem with read-only directories.
    read_only: true
    cap_drop: [ALL]
    cap_add: [DAC_OVERRIDE]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp:size=64m]
    environment:
      LABWARDEN_URL: http://labwarden:8080
      LABWARDEN_TOKEN: ${LABWARDEN_INGEST_TOKEN:?run scripts/dev-env.sh first}
      LABWARDEN_HOST: testbed-docker
      LABWARDEN_GROUP: testbed
      LABWARDEN_DOCKER_URL: tcp://testbed-docker-proxy:2375
      LABWARDEN_DOCKER_LABEL: labwarden.scan=true
      LABWARDEN_INTERVAL: "900"
    volumes:
      - testbed-docker-state:/var/lib/labwarden

volumes:
  testbed-vm-state: {}
  testbed-docker-state: {}
