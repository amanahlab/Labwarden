name: labwarden
# LabWarden dashboard. Start: docker compose up -d -> http://<host>:8080
# Admin password: docker compose exec labwarden cat /data/admin-password
# Optional settings go in .env next to this file (see .env.example).
services:
  labwarden:
    # Release tag + multi-arch index digest (docker buildx imagetools inspect).
    image: ghcr.io/amanahlab/labwarden:0.1.0@sha256:4f3b86bb85dd94bca9dd41fe04906ea40f2ef00070ccb07c43124ec137fdd4a1
    restart: unless-stopped
    # Writes only to /data (TMPDIR included); needs no capabilities.
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp:size=64m]
    ports:
      - "${LABWARDEN_PORT:-8080}:8080"
    env_file:
      - path: .env
        required: false
    environment:
      LABWARDEN_DATA: /data
    volumes:
      - labwarden-data:/data

volumes:
  labwarden-data: {}
