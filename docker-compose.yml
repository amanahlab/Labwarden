name: labwarden
# LabWarden dashboard. `docker compose up -d --build` -> http://localhost:8080
# The testbed (deliberately vulnerable hosts) runs with: --profile testbed
services:
  labwarden:
    build:
      context: .
      args:
        VERSION: ${LABWARDEN_VERSION:-dev}
    image: labwarden:latest
    restart: unless-stopped
    ports:
      - "${LABWARDEN_PORT:-8080}:8080"
    env_file:
      - path: .env
        required: false
    environment:
      LABWARDEN_DATA: /data
    volumes:
      - labwarden-data:/data

  # --- testbed: proving ground, never deploy these -------------------------
  testbed-vm:
    profiles: [testbed]
    build: testbed/vm
    hostname: testbed-vm
    depends_on: [labwarden]
    environment:
      LABWARDEN_URL: http://labwarden:8080
      LABWARDEN_TOKEN: ${LABWARDEN_INGEST_TOKEN:?run scripts/dev-env.sh first}
      LABWARDEN_HOST: testbed-vm
      LABWARDEN_GROUP: testbed
      LABWARDEN_SCAN_PATHS: /
      LABWARDEN_SCAN_DOCKER: "false"
      LABWARDEN_CRON: "*/15 * * * *"
      LABWARDEN_INTERVAL: "900"
    volumes:
      - testbed-vm-state:/var/lib/labwarden

  testbed-workload:
    profiles: [testbed]
    build: testbed/docker
    image: labwarden-testbed-workload:latest
    labels:
      labwarden.scan: "true"

  testbed-docker-agent:
    profiles: [testbed]
    build: agent
    image: labwarden-agent:latest
    hostname: testbed-docker
    depends_on: [labwarden, testbed-workload]
    environment:
      LABWARDEN_URL: http://labwarden:8080
      LABWARDEN_TOKEN: ${LABWARDEN_INGEST_TOKEN:?run scripts/dev-env.sh first}
      LABWARDEN_HOST: testbed-docker
      LABWARDEN_GROUP: testbed
      LABWARDEN_DOCKER_LABEL: labwarden.scan=true
      LABWARDEN_INTERVAL: "900"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - testbed-docker-state:/var/lib/labwarden

volumes:
  labwarden-data: {}
  testbed-vm-state: {}
  testbed-docker-state: {}
